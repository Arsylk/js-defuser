name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The release gates: whole programs at js-confuser's maximum settings
      # must still come back as their source. Minutes each, kept separate so a
      # unit failure shows up first.
      - run: npm run test:gates
